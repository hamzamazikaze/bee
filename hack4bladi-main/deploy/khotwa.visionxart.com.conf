# /etc/nginx/sites-enabled/khotwa.visionxart.com
#
# Written to match the vhosts already on that box (volora, ecole-badar, brrani): nginx
# terminates TLS and proxies to a container bound to 127.0.0.1. Only the port and the name
# differ.
#
# Install:
#   scp deploy/khotwa.visionxart.com.conf visionxart:/etc/nginx/sites-available/khotwa.visionxart.com
#   ssh visionxart 'ln -s /etc/nginx/sites-available/khotwa.visionxart.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx'
#
# Then let certbot rewrite the :80 block and attach the certificate, exactly as it did for
# the others:
#   ssh visionxart 'certbot --nginx -d khotwa.visionxart.com'
#
# The A record has to exist and resolve before certbot runs, or the challenge fails.

server {
    listen 80;
    listen [::]:80;
    server_name khotwa.visionxart.com;
    # Certbot replaces this with its own redirect and adds the challenge location.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khotwa.visionxart.com;

    # A voice recording is a file upload. The default is 1 MB, and UPLOAD.maxBytes allows
    # 8 — a long recording would be refused by the proxy before the app ever saw it.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # THE POINT OF USING THIS SERVER. Transcribing Darija means waiting on a queued
        # public GPU Space — measured between 14 and 39 seconds, bounded at 45. nginx
        # defaults to 60s, which would hold today and fail on a slow day. Vercel could not
        # be told this at all, which is why voice was the thing that made it a bad fit.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Streaming responses should reach the browser as they are produced.
        proxy_buffering off;
    }

    # ssl_certificate lines are added by certbot --nginx.
}
